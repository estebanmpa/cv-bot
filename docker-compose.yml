name: cvbot-local

services:
  cvbot-server:
    container_name: cvbot-container
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      - cvbot-cache

  cvbot-www:
    container_name: cvbot-frontend-container
    build:
      context: ./www
      dockerfile: Dockerfile
    ports:
      - 4000:4000
    restart: unless-stopped
    env_file:
      - ./www/.env

  cvbot-cache:
    image: redis
    container_name: cvbot-cache-container
    restart: unless-stopped
    volumes:
      - cvbot-redis-volume:/data
    ports:
      - 6381:6379
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  cvbot-redis-volume:
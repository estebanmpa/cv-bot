name: cvbot-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  cvbot-server:
    container_name: cvbot-server-container
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - cvbot-cache

  cvbot-www:
    container_name: cvbot-frontend-container
    build:
      context: ./www
      dockerfile: Dockerfile
    ports:
      - 4000:4000
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./www/.env

  cvbot-cache:
    image: redis
    container_name: cvbot-cache-container
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - cvbot-redis-volume:/data
    ports:
      - 6381:6379
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  cvbot-redis-volume:
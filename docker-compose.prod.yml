name: cvbot-prod

services:
  cvbot-server:
    container_name: cvbot-backend-container
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "3000"
    networks:
      - proxy-network
      - cvbot-private-network
    depends_on:
      - cvbot-cache

  cvbot-www:
    container_name: cvbot-frontend-container
    build:
      context: ./www
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./www/.env
    networks:
      - proxy-network

  cvbot-cache:
    image: redis:7-alpine
    container_name: cvbot-cache-container
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cvbot-redis-volume:/data
    networks:
      - cvbot-private-network
    ports:
      - "127.0.0.1:6381:6379"

volumes:
  cvbot-redis-volume:

networks:
  proxy-network:
    external: true

  cvbot-private-network:
    driver: bridge
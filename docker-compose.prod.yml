name: cv-bot-prod

services:
  cvbot-server:
    container_name: cvbot-container
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - proxy-network
      - cvbot-private-network

networks:
  proxy-network:
    external: true

  cvbot-private-network:
    driver: bridge